[package]
name = "timu-core"
version = "0.1.0"
edition = "2024"

[dependencies]
russh = "0.62"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "sync", "time"] }
uniffi = { version = "0.32.0", optional = true }

[dev-dependencies]
serde_json = "1"

[features]
ffi = ["dep:uniffi"]
# Bindings-generation CLI (build-time tooling only, not for mobile builds).
uniffi-cli = ["ffi", "uniffi/cli"]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi-cli"]